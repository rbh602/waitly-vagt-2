name: Waitly-vagt

on:
  schedule:
    - cron: "7,37 * * * *"   # hver halve time (UTC); undgår det travle hele klokkeslæt
  workflow_dispatch:          # gør det muligt at starte en kørsel manuelt

permissions:
  contents: write             # nødvendigt for at gemme waitly_state.json

concurrency:
  group: waitly-vagt
  cancel-in-progress: false

jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer pakker
        run: pip install requests beautifulsoup4

      - name: Tjek Waitly
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python waitly_vagt.py

      - name: Gem tilstand
        run: |
          git config user.name "waitly-vagt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waitly_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Opdater tilstand"
            git pull --rebase
            git push
          fi
